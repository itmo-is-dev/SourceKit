name: "publish packages"

on:
  push:
    branches: [ master ]
    paths:
      - 'src/**'
      - '.github/workflows/publish.yml'
      - '*.props'
      - '*.slnx'

  workflow_dispatch:

jobs:
  publish:
    name: build and publish
    runs-on: ubuntu-latest
    environment: nuget.org
    
    steps:
      - uses: actions/checkout@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: 10.0.x

      - name: restore
        run: dotnet restore SourceKit.slnx

      - name: build
        run: |
          dotnet build SourceKit.slnx -c Release --no-restore /p:PatchVersion=${{ github.run_number }} /p:GeneratePackageOnBuild=false
          dotnet build SourceKit.slnx -c Release --no-restore /p:PatchVersion=${{ github.run_number }}

      - name: publish to GitHub nuget repository
        run: |
          for file in bin/packages/*.nupkg
          do
            dotnet nuget push "${file#/}" --source "nuget.org" --api-key ${{ secrets.NUGET_API_KEY }}
          done